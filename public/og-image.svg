<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ILMS — Intelligent Leave Management System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1207"/>
      <stop offset="1" stop-color="#0e0b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5A2B"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative rings -->
  <g fill="none" stroke="#8B5A2B" stroke-opacity="0.18" stroke-width="1.5">
    <circle cx="980" cy="150" r="220"/>
    <circle cx="980" cy="150" r="150"/>
    <circle cx="980" cy="150" r="80"/>
  </g>

  <!-- badge -->
  <rect x="90" y="150" width="96" height="96" rx="22" fill="url(#accent)"/>
  <path d="M138 176 l22 10 v18 c0 18 -13 30 -22 34 c-9 -4 -22 -16 -22 -34 v-18 z"
        fill="#F8E7C9" transform="translate(0,-2)"/>

  <text x="92" y="360" font-family="Syne, 'Segoe UI', Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff">ILMS</text>
  <text x="96" y="424" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#D8B98C">Intelligent Leave Management System</text>
  <text x="96" y="476" font-family="'Space Mono', 'Courier New', monospace" font-size="22" fill="#9c8f7f">Requests · Approvals · Analytics · Audit</text>

  <rect x="96" y="520" width="1008" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <text x="96" y="560" font-family="'Space Mono', 'Courier New', monospace" font-size="20" fill="#7a7168">NIMASA · Authorized personnel only</text>
</svg>
